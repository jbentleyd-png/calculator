<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="j.js" defer></script>
    <script src="clicks.js" defer></script>
  </head>
  <body>
    <h1 id="title">Calculator</h1>
    <div class="calcUI">
      <div class="display">42069777969696.9696964</div>

      <div class="row">
        <button id="seven" class="numberButton">7</button>
        <button id="eight" class="numberButton">8</button>
        <button id="nine" class="numberButton">9</button>
        <button id="plus" class="operatorButton">+</button>
      </div>
      <div class="row">
        <button id="four" class="numberButton">4</button>
        <button id="five" class="numberButton">5</button>
        <button id="six" class="numberButton">6</button>
        <button id="minus" class="operatorButton">-</button>
      </div>
      <div class="row">
        <button id="one" class="numberButton">1</button>
        <button id="two" class="numberButton">2</button>
        <button id="three" class="numberButton">3</button>
        <button id="multiply" class="operatorButton">x</button>
      </div>
      <div class="row">
        <button id="zero" class="numberButton">0</button>
        <button id="decimal" class="numberButton">.</button>
        <button id="toKanji" class="numberButton">漢</button>
        <button id="divide" class="operatorButton">/</button>
      </div>
      <div class="row">
        <button id="clear" class="halfButton">CLEAR</button>
        <button id="equal" class="halfButton">=</button>
      </div>
    </div>
  </body>
</html>
