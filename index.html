<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="j.js" defer></script>
  </head>
  <body>
    <h1>Calculator</h1>
    <h1>計算機</h1>
    <div class="calcUI">
      <div class="display"></div>

      <div class="row">
        <button id="7" class="numberButton">7</button>
        <button id="8" class="numberButton">8</button>
        <button id="9" class="numberButton">9</button>
        <button id="+" class="operatorButton">+</button>
      </div>
      <div class="row">
        <button id="4" class="numberButton">4</button>
        <button id="5" class="numberButton">5</button>
        <button id="6" class="numberButton">6</button>
        <button id="-" class="operatorButton">-</button>
      </div>
      <div class="row">
        <button id="1" class="numberButton">1</button>
        <button id="2" class="numberButton">2</button>
        <button id="3" class="numberButton">3</button>
        <button id="*" class="operatorButton">x</button>
      </div>
      <div class="row">
        <button id="0" class="numberButton">0</button>
        <button id="decimal" class="numberButton">.</button>
        <button id="toKanji" class="numberButton">漢</button>
        <button id="/" class="operatorButton">/</button>
      </div>
      <div class="row">
        <button id="clear" class="halfButton">CLEAR</button>
        <button id="=" class="halfButton">=</button>
      </div>
    </div>
  </body>
</html>
